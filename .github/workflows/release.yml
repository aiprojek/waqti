name: Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Set build version
        run: |
          node -e "
            const fs = require('fs');
            const d = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const v = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes());
            const winV = '1.0.' + pad(d.getMonth() + 1) + pad(d.getDate()) + '.' + pad(d.getHours()) + pad(d.getMinutes());
            const androidV = Math.floor((d.getTime() - new Date('2025-01-01').getTime()) / 60000);
            fs.appendFileSync(process.env.GITHUB_ENV, 'BUILD_VERSION=' + v + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'WIN_VERSION=' + winV + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_VERSION_CODE=' + androidV + '\n');
          "

      - name: Install dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: |
          npx cap sync
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../Waqti-Android-debug.apk

      - name: Prepare Android signing (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > waqti.keystore
          cat > key.properties <<EOF
          storeFile=waqti.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

      - name: Build Android Release APK (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            mv app/build/outputs/apk/release/app-release.apk ../Waqti-Android-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            mv app/build/outputs/apk/release/app-release-unsigned.apk ../Waqti-Android-release-unsigned.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waqti-android
          path: |
            Waqti-Android-debug.apk
            Waqti-Android-release.apk
            Waqti-Android-release-unsigned.apk

  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Set build version
        run: |
          node -e "
            const fs = require('fs');
            const d = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            const v = d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes());
            const winV = '1.0.' + pad(d.getMonth() + 1) + pad(d.getDate()) + '.' + pad(d.getHours()) + pad(d.getMinutes());
            const androidV = Math.floor((d.getTime() - new Date('2025-01-01').getTime()) / 60000);
            fs.appendFileSync(process.env.GITHUB_ENV, 'BUILD_VERSION=' + v + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'WIN_VERSION=' + winV + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'ANDROID_VERSION_CODE=' + androidV + '\n');
          "

      - name: Install App dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 libx11-xcb1 libxkbfile1 libxshmfence1 libfuse2

      - name: Build Desktop (Electron)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish=never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waqti-desktop-${{ matrix.platform }}
          path: |
            dist/*.AppImage
            dist/*.snap
            dist/*.dmg
            dist/*.exe
            dist/*.msi
            dist/latest*.yml

  create-release:
    needs: [build-android, build-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: waqti-android
          path: artifacts/android

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/desktop

      - name: Create Combined Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/android/Waqti-Android-debug.apk
            artifacts/android/Waqti-Android-release.apk
            artifacts/android/Waqti-Android-release-unsigned.apk
            artifacts/desktop/**/*.AppImage
            artifacts/desktop/**/*.snap
            artifacts/desktop/**/*.dmg
            artifacts/desktop/**/*.exe
            artifacts/desktop/**/*.msi
            artifacts/desktop/**/latest*.yml
          draft: true
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
